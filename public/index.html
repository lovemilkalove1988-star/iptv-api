<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>IPTV Channels</title>

  <p>
  Онлайн IPTV каталог каналов.
  Выберите канал ниже для просмотра.
  </p>
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      padding: 20px;
    }

    h1 {
      color: #00ff99;
    }

    video {
      width: 100%;
      max-width: 700px;
      background: black;
      border-radius: 10px;
    }

    .channel {
      background: #222;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .channel:hover {
      background: #333;
    }

    .category {
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>

<body>

<h1>IPTV Channels</h1>

<video id="player" controls></video>

<h2>Каналы</h2>

<div id="list">Загрузка...</div>

<script>

let channels = [];

const player = document.getElementById("player");

function playChannel(url) {

  if (Hls.isSupported()) {

    const hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(player);

  } else {

    player.src = url;

  }

  player.play();

}


fetch("/api/channels")
.then(res => res.json())
.then(data => {

  channels = data;

  const list = document.getElementById("list");

  list.innerHTML = "";

  channels.forEach(ch => {

    list.innerHTML += `
      <div class="channel" onclick="playChannel('${ch.url}')">

        <b>${ch.name}</b>

        <div class="category">
          ${ch.category}
        </div>

      </div>
    `;

  });

});

</script>

</body>
</html>
