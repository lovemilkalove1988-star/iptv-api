<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>IPTV Channels</title>

  <p>
  Онлайн IPTV каталог каналов.
  Выберите канал ниже для просмотра.
  </p>
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      padding: 20px;
    }

    h1 {
      color: #00ff99;
    }

    video {
      width: 100%;
      max-width: 700px;
      background: black;
      border-radius: 10px;
    }

    .channel {
      background: #222;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .channel:hover {
      background: #333;
    }

    .category {
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>

<body>

<h1>IPTV Channels</h1>

<video id="player" controls></video>

<h2>Каналы (<span id="count">0</span>)</h2>

  <input 
id="search" 
placeholder="Поиск канала..." 
style="width:100%;padding:10px;font-size:16px;border-radius:8px;"
>

<br><br>

<div id="list">Загрузка...</div>

<script>

let channels = [];

const player = document.getElementById("player");

function playChannel(url) {

  if (Hls.isSupported()) {

    const hls = new Hls();

    hls.loadSource(url);
    hls.attachMedia(player);

  } else {

    player.src = url;

  }

  player.play();

}


const list = document.getElementById("list");
const search = document.getElementById("search");
const count = document.getElementById("count");


function showChannels(items) {

  list.innerHTML = "";

  items.forEach(ch => {

    list.innerHTML += `
      <div class="channel" onclick="playChannel('${ch.url}')">
        <b>${ch.name}</b>
        <div class="category">${ch.category || ""}</div>
      </div>
    `;

  });

}


fetch("/api/channels")

  .then(res => {

    if (!res.ok) {
      throw new Error("HTTP " + res.status);
    }

    return res.json();

  })

  .then(data => {

    channels = data;

    count.innerText = channels.length;

    showChannels(channels);

  })

  .catch(error => {

    console.error("Ошибка загрузки каналов:", error);

    list.innerHTML = `
      <div style="padding:20px;color:red;">
        Ошибка загрузки каналов
      </div>
    `;

  });


search.oninput = function() {

  const text = this.value.toLowerCase();

  const filtered = channels.filter(ch =>
    ch.name.toLowerCase().includes(text)
  );

  showChannels(filtered);

};


</script>

</body>
</html>
