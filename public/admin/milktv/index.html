<head>

<title>МИЛК ТВ</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#090909;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:16px;
}

.header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.header-info{
  flex:1;
  min-width:0;
}

.top-logout{
  flex-shrink:0;
  padding:7px 10px;
  border:1px solid #333;
  border-radius:9px;
  background:#1c1c1c;
  color:#aaa;
  text-decoration:none;
  font-size:12px;
  white-space:nowrap;
}

.top-logout:hover{
  background:#252525;
  color:#fff;
}

.back{
  color:#aaa;
  text-decoration:none;
  font-size:28px;
}

.logo{
  font-size:30px;
}

.title{
  font-size:24px;
  font-weight:bold;
}

.subtitle{
  color:#777;
  font-size:12px;
  margin-top:3px;
}

.search{
  margin-bottom:14px;
}
.milktv-stats{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:8px;
  margin-bottom:14px;
}

.milktv-stat{
  background:#151515;
  border:1px solid #292929;
  border-radius:12px;
  padding:10px 8px;
  text-align:center;
}

.milktv-stat-value{
  font-size:20px;
  font-weight:bold;
  line-height:22px;
}

.milktv-stat-label{
  margin-top:4px;
  color:#777;
  font-size:10px;
}
.automation-status{display:flex;flex-wrap:wrap;gap:5px;margin:-5px 0 10px}.automation-status span,.automation-status button{padding:4px 7px;border:1px solid #333;border-radius:7px;background:#151515;color:#aeb6c6;font:11px Arial,sans-serif}.automation-status button{cursor:pointer}.automation-status .degraded{color:#ff9b9b}.automation-status .ok{color:#73df91}

.milktv-stat.online .milktv-stat-value{
  color:#35d05f;
}

.milktv-stat.offline .milktv-stat-value{
  color:#aaa;
}

.milktv-stat.quarantine .milktv-stat-value{
  color:#ff6b6b;
}

.milktv-stat.views .milktv-stat-value,
.milktv-stat.viewers .milktv-stat-value{
  color:#ffd166;
}

@media(max-width:700px){
  .milktv-stats{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-width:400px){
  .milktv-stats{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}


.search input{
  width:100%;
  padding:12px 14px;
  background:#151515;
  color:#fff;
  border:1px solid #292929;
  border-radius:11px;
  outline:none;
  font-size:15px;
}

.categories{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:16px;
}

.category{
  background:#1c1c1c;
  border:1px solid #333;
  border-radius:10px;
  padding:9px 12px;
  color:#ccc;
  cursor:pointer;
  user-select:none;
  font-size:13px;
}

.category:hover{
  background:#252525;
}

.category.active{
  background:#333;
  border-color:#666;
  color:#fff;
}

.channels-box{
  background:#151515;
  border:1px solid #292929;
  border-radius:16px;
  padding:16px;
}

.channels-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:14px;
}

.channel-list{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}

.channel{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:150px;
  padding:12px;
  background:#1c1c1c;
  border:1px solid #292929;
  border-radius:13px;
  color:#fff;
  text-decoration:none;
  cursor:pointer;
  transition:.15s;
}

.channel:hover{
  background:#252525;
  border-color:#4a4a4a;
  transform:translateY(-1px);
}

.channel:active{
  transform:scale(.98);
}

.channel-logo{
  width:68px;
  height:68px;
  object-fit:contain;
  border-radius:10px;
  margin-bottom:9px;
  background:#111;
}

.channel-placeholder{
  width:68px;
  height:68px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  border-radius:10px;
  font-size:32px;
  margin-bottom:9px;
}

.channel-name{
  width:100%;
  text-align:center;
  font-size:13px;
  line-height:16px;
  overflow:hidden;
  text-overflow:ellipsis;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}

.channel-bottom{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:7px;
}

.slot-info{
  width:100%;
  margin-top:7px;
  color:#aaa;
  font-size:11px;
  line-height:14px;
  text-align:center;
}

.slot-actions{
  width:100%;
  display:flex;
  flex-direction:column;
  gap:5px;
  margin-top:7px;
}

.slot-action-button,
.slot-select{
  width:100%;
  min-height:30px;
  padding:5px 7px;
  border:1px solid #444;
  border-radius:7px;
  background:#111;
  color:#ddd;
  font-size:11px;
}

.slot-action-button{
  cursor:pointer;
}

.slot-action-button:hover{
  background:#292929;
}

.pool-controls{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  margin-top:6px;
}

.pool-badge{
  color:#c9a7ff;
  font-size:10px;
  font-weight:bold;
}

.pool-button{
  padding:4px 7px;
  border:1px solid #4b3d64;
  border-radius:6px;
  background:#18121f;
  color:#d9c8ff;
  cursor:pointer;
  font-size:10px;
}

.pool-button:hover{
  background:#2a1d38;
}

.status{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#222;
  flex-shrink:0;
}

.status.online{
  background:#35d05f;
  box-shadow:0 0 7px rgba(53,208,95,.55);
}

.status.checking{
  background:#e5b93f;
  box-shadow:0 0 7px rgba(229,185,63,.45);
}

.status.offline,
.status.quarantine{
  border:1px solid #444;
}
.status.offline{background:#d85b5b;box-shadow:0 0 7px rgba(216,91,91,.45)}
.status.quarantine{background:#8a6cc2;box-shadow:0 0 7px rgba(138,108,194,.45)}
.status.unknown{background:#77808d;border:1px solid #aab0b8}

.rating{
  font-size:11px;
  color:#888;
}

.channel-boost{
  position:absolute;
  top:8px;
  right:8px;
  min-width:28px;
  padding:4px 6px;
  border-radius:7px;
  color:#ffd166;
  font-size:11px;
  font-weight:bold;
  text-align:center;
  cursor:pointer;
  z-index:2;
}
.channel-boost,.channel .slot-actions,.channel .pool-controls{display:none}
.channel-category{margin-top:4px;color:#999;font-size:11px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.channel-settings-title{font-size:18px;font-weight:700;margin:4px 0 8px}.channel-settings-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0 12px}.channel-settings-summary div{padding:9px;border:1px solid #333;border-radius:9px;background:#111;font-size:12px}.channel-settings-tabs{display:flex;gap:6px;overflow:auto;margin:8px 0 10px}.channel-settings-tabs span{flex:0 0 auto;padding:6px 9px;border-radius:7px;background:#242424;color:#ccc;font-size:12px}

.channel-boost:hover{
  background:#303030;
}

.empty{
  color:#777;
  text-align:center;
  padding:35px 10px;
}

.m3u-list{display:grid;gap:5px}.m3u-row{display:flex;align-items:center;gap:8px;padding:7px;background:#1c1c1c;border-radius:7px;font-size:11px;min-width:0}.m3u-row .grow{flex:1;min-width:0}.m3u-muted{color:#999}.m3u-url{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px}.m3u-error{color:#ff9b9b}.m3u-ok{color:#73df91}

<body>

<div class="container">

<div class="header">

<a class="back" href="/admin">‹</a>

<div class="logo">📺</div>

<div class="header-info">
<div class="title">МИЛК ТВ</div>
<div class="subtitle">Клиентский вид</div>
</div>

<button id="adminModeToggle" class="admin-toggle" type="button" aria-pressed="false">АДМИН: OFF</button>

<a class="top-logout" href="/logout">🚪 Выйти</a>

</div>

<div class="milktv-stats">

  <div class="milktv-stat" data-status-filter="" role="button" tabindex="0">
    <div class="milktv-stat-value" id="statTotal">0</div>
    <div class="milktv-stat-label">ВСЕГО</div>
  </div>

  <div class="milktv-stat online" data-status-filter="online" role="button" tabindex="0">
    <div class="milktv-stat-value" id="statOnline">0</div>
    <div class="milktv-stat-label">ONLINE</div>
  </div>

  <div class="milktv-stat offline" data-status-filter="offline" role="button" tabindex="0">
    <div class="milktv-stat-value" id="statOffline">0</div>
    <div class="milktv-stat-label">OFFLINE</div>
  </div>

  <div class="milktv-stat quarantine" data-status-filter="quarantine" role="button" tabindex="0">
    <div class="milktv-stat-value" id="statQuarantine">0</div>
    <div class="milktv-stat-label">КАРАНТИН</div>
  </div>

  <div class="milktv-stat unknown" data-status-filter="unknown" role="button" tabindex="0">
    <div class="milktv-stat-value" id="statUnknown">0</div>
    <div class="milktv-stat-label">НЕИЗВЕСТНО</div>
  </div>

  <div class="milktv-stat reserve" data-status-filter="reserve" role="button" tabindex="0">
    <div class="milktv-stat-value" id="statReserve">0</div>
    <div class="milktv-stat-label">РЕЗЕРВ</div>
  </div>

</div>
<div class="search">
<input
  type="text"
  id="searchInput"
  placeholder="🔎 Поиск канала..."
>
<select id="sortSelect" aria-label="Сортировка" style="margin-top:6px;min-height:34px;width:100%;background:#111;color:#ddd;border:1px solid #444;border-radius:8px;padding:6px">
  <option value="rating">По рейтингу (сначала высокий)</option><option value="az">А — Я</option><option value="za">Я — А</option><option value="new">Новые сначала</option><option value="old">Старые сначала</option><option value="category">По категории</option><option value="status">По статусу</option><option value="id">По ID</option>
</select>
</div>

<div class="categories">

<div class="category active" data-category="">
📋 Все
</div>

<div class="category" data-category="__hidden__">Скрытые</div>

<div class="category" data-category="Казахстан">
🇰🇿 Казахстан
</div>

<div class="category" data-category="Детские">
🧒 Детские
</div>

<div class="category" data-category="Кино">
🎬 Кино
</div>

<div class="category" data-category="Музыка">
🎵 Музыка
</div>

<div class="category" data-category="Спорт">
⚽ Спорт
</div>

</div>

<section id="adminPreviewPlayer" class="admin-preview-player" aria-live="polite">
  <div id="adminPreviewPlayerContent" class="admin-preview-player-content"></div>
</section>
<div class="channels-box">

<div class="channels-title">
Каналы
</div>

<div class="empty" id="empty">
Загрузка каналов...
</div>

<div class="channel-list" id="channelList"></div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
<script src="/milktv-player-controller.js?v=20260831-audit"></script>
<script>

let allChannels = [];
let actionRequiredOnly = false;
function needsIntervention(channel){
  const confirmed = Number(channel.milktv_failed_checks || 0) >= 3 || channel.milktv_status === "quarantine";
  return confirmed && channel.has_usable_reserve !== true;
}
function updateActionRequired(){
  const button=document.getElementById("actionRequiredFilter");

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

async function submitExistingAdminAction(url, params){
  const token=await getCsrfToken();
  const response=await fetch(url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded","X-CSRF-Token":token},body:new URLSearchParams(params).toString(),redirect:"follow"});
  if(!response.ok)throw Error("Не удалось сохранить изменение");
}
async function editManualRating(channel){
  const value=prompt("Ручной рейтинг канала (0–100):",Number(channel.milktv_manual_boost||0));
  if(value===null)return;
  const rating=Number(value);
  if(!Number.isInteger(rating)||rating<0||rating>100){alert("Введите целое число от 0 до 100");return}
  try{await submitExistingAdminAction("/admin/channels/manual-boost",{id:channel.id,manual_boost:rating});await loadChannels()}catch(error){alert(error.message)}
}

async function getCsrfToken(){

  const response = await fetch("/api/admin/csrf");

  if(!response.ok){
    throw new Error("Не удалось получить CSRF-токен");
  }

  const data = await response.json();
  return data.token;

}

async function readAdminActionError(response){

  let data = null;

  try{
    data = await response.json();
  }catch(error){
    data = null;
  }

  if(response.status === 409){
    return data && data.error
      ? data.error
      : "Операция невозможна: slot уже занят или недоступен";
  }

  if(response.status === 404){
    return data && data.error
      ? data.error
      : "Канал или slot не найден";
  }

  if(response.status === 400){
    return data && data.error
      ? data.error
      : "Некорректные данные";
  }

  return "Не удалось выполнить операцию";

}

function addSlotControls(item, channel){

  const slotId = channel.slot_id;
  const currentId = channel.slot_current_channel_id === null
    ? null
    : Number(channel.slot_current_channel_id);
  const channelId = Number(channel.id);
  const status = channel.milktv_status || "offline";

  const slotInfo =
    document.createElement("div");

  slotInfo.className = "slot-info";

  if(!slotId){
    slotInfo.textContent = "Место: slot отсутствует";
  }else if(currentId === null){
    slotInfo.textContent = "Место: свободно";
  }else if(currentId === channelId){
    slotInfo.textContent = "Место: свой канал";
  }else{
    slotInfo.textContent =
      "Замена: " +
      (channel.current_channel_name || "Канал") +
      " (" + currentId + ")";
  }

  item.appendChild(slotInfo);

  if(status !== "quarantine" || !slotId){
    return;
  }

  const actions =
    document.createElement("div");

  actions.className = "slot-actions";

  if(currentId === null){

    const assignButton =
      document.createElement("button");

    assignButton.type = "button";
    assignButton.className = "slot-action-button";
    assignButton.textContent = "Замена";

    assignButton.addEventListener("click", async event => {

      event.preventDefault();
      event.stopPropagation();

      if(actions.querySelector(".slot-select")){
        return;
      }

      const select =
        document.createElement("select");

      select.className = "slot-select";

      const placeholder =
        document.createElement("option");

      placeholder.value = "";
      placeholder.textContent = "Выберите канал";
      placeholder.selected = true;
      select.appendChild(placeholder);

      const replacementOptions = allChannels
        .filter(option =>
          option.is_replacement_pool === true &&
          Number(option.id) !== channelId
        );

      if(!replacementOptions.length){
        alert("Нет каналов в резерве");
        return;
      }

      replacementOptions.forEach(option => {
          const itemOption =
            document.createElement("option");

          itemOption.value = option.id;
          itemOption.textContent =
            (option.name || "Без названия") +
            " (" + option.id + ")";
          select.appendChild(itemOption);
        });

      const confirmButton =
        document.createElement("button");

      confirmButton.type = "button";
      confirmButton.className = "slot-action-button";
      confirmButton.textContent = "Подтвердить";

      confirmButton.addEventListener("click", async confirmEvent => {

        confirmEvent.preventDefault();
        confirmEvent.stopPropagation();

        if(!select.value){
          alert("Выберите replacement-канал");
          return;
        }

        try{
          const token = await getCsrfToken();
          const response = await fetch(
            "/admin/milktv/slots/" +
              encodeURIComponent(channelId) +
              "/replacement",
            {
              method:"POST",
              headers:{
                "Content-Type":"application/json",
                "X-CSRF-Token":token
              },
              body:JSON.stringify({
                replacement_channel_id:Number(select.value)
              })
            }
          );

          if(!response.ok){
            throw new Error(await readAdminActionError(response));
          }

          await loadChannels();
        }catch(error){
          alert(error.message || "Не удалось назначить replacement");
        }
      });

      actions.appendChild(select);
      actions.appendChild(confirmButton);
      select.focus();
    });

    actions.appendChild(assignButton);

  }else if(currentId !== channelId){

    const removeButton =
      document.createElement("button");

    removeButton.type = "button";
    removeButton.className = "slot-action-button";
    removeButton.textContent = "Снять замену";

    removeButton.addEventListener("click", async event => {

      event.preventDefault();
      event.stopPropagation();

      try{
        const token = await getCsrfToken();
        const response = await fetch(
          "/admin/milktv/slots/" +
            encodeURIComponent(channelId) +
            "/replacement",
          {
            method:"DELETE",
            headers:{
              "X-CSRF-Token":token
            }
          }
        );

        if(!response.ok){
          throw new Error(await readAdminActionError(response));
        }

        await loadChannels();
      }catch(error){
        alert(error.message || "Не удалось снять replacement");
      }
    });

    actions.appendChild(removeButton);
  }

  item.appendChild(actions);

}

function addReplacementPoolControl(item, channel){

  const controls =
    document.createElement("div");

  controls.className = "pool-controls";

  const inPool =
    channel.is_replacement_pool === true;

  if(inPool){

    const badge =
      document.createElement("span");

    badge.className = "pool-badge";
    badge.textContent = "Резерв";
    controls.appendChild(badge);
  }

  const button =
    document.createElement("button");

  button.type = "button";
  button.className = "pool-button";
  button.textContent = inPool ? "Убрать из резерва" : "В резерв канала";

  button.addEventListener("click", async event => {

    event.preventDefault();
    event.stopPropagation();

    try{
      const token = await getCsrfToken();
      const response = await fetch(
        "/admin/milktv/replacement-pool/" +
          encodeURIComponent(Number(channel.id)),
        {
          method: inPool ? "DELETE" : "POST",
          headers:{
            "X-CSRF-Token":token
          }
        }
      );

      if(!response.ok){
        throw new Error(await readAdminActionError(response));
      }

      await loadChannels();
    }catch(error){
      alert(error.message || "Не удалось изменить replacement pool");
    }
  });

  controls.appendChild(button);

  const sourcesButton = document.createElement("button");
  sourcesButton.type = "button";
  sourcesButton.className = "pool-button";
  sourcesButton.textContent = "Источники";
  sourcesButton.addEventListener("click", async event => {
    event.preventDefault();
    event.stopPropagation();
    openSourcesDialog(channel);
  });
  controls.appendChild(sourcesButton);
  item.appendChild(controls);

}

function startAdminDetailPlayer(video,url,status,requestId){
  const message=status||document.getElementById("adminDetailPlayerStatus");
  const current=()=>requestId===adminPlayerRequestId;
  const failed=()=>{if(current())setAdminPlayerMessage(message,"Не удалось запустить канал",()=>adminRetryPlayback&&adminRetryPlayback());};
  if(!video||!url){failed();return;}
  if(!window.MilkTvPlayerController){failed();return;}
  adminDetailVideo=video;
  adminDetailController=window.MilkTvPlayerController.create(video,{
    onLoading:()=>{if(current())setAdminPlayerMessage(message,"");},
    onPlaying:()=>{if(current())setAdminPlayerMessage(message,"");},
    onError:failed
  });
  adminDetailController.play(url);
}
async function playAdminLogicalChannel(channel,video,status){
  const channelId=Number(channel&&channel.id);
  if(!Number.isInteger(channelId)||channelId<=0){setAdminPlayerMessage(status,"Не удалось запустить канал");return;}
  const requestId=++adminPlayerRequestId;
  destroyAdminDetailPlayer(false);
  adminRetryPlayback=()=>playAdminLogicalChannel(channel,video,status);
  setAdminPlayerMessage(status,"");
  try{
    const response=await fetch(`/api/v1/client/public/channels/${encodeURIComponent(channelId)}/play`);
    const payload=await response.json();
    if(requestId!==adminPlayerRequestId)return;
    if(!response.ok||!payload.ok||!payload.data?.playback_url)throw Error("playback");
    startAdminDetailPlayer(video,payload.data.playback_url,status,requestId);
  }catch(error){if(requestId===adminPlayerRequestId)setAdminPlayerMessage(status,"Не удалось запустить канал",()=>adminRetryPlayback&&adminRetryPlayback());}
}

function renderChannels(){

  const list =
    document.getElementById("channelList");

  const empty =
    document.getElementById("empty");

  list.innerHTML = "";

  let channels = [...allChannels];

  if(selectedCategory === "__hidden__"){
    channels = channels.filter(channel => channel.visible_to_clients === false);
  }else{
    channels = channels.filter(channel => channel.visible_to_clients !== false);
  }

  if(actionRequiredOnly){
    channels=channels.filter(needsIntervention);
  }else if(statusFilter){
    channels = channels.filter(channel => statusFilter === "reserve"
      ? channel.has_usable_reserve === true
      : channel.milktv_status === statusFilter);
  } else if(problemsOnly){
    channels = channels.filter(channel =>
      channel.milktv_status === "offline" || channel.milktv_status === "quarantine"
    );
  }

  if(selectedCategory && selectedCategory !== "__hidden__"){

    channels = channels.filter(channel =>
      Array.isArray(channel.milktv_categories) &&
      channel.milktv_categories.includes(selectedCategory)
    );

  }

  if(searchText){

    channels = channels.filter(channel =>
      String(channel.name || "")
        .toLowerCase()
        .includes(searchText)
    );

  }

  const byName=(a,b)=>String(a.name||"").localeCompare(String(b.name||""),"ru");
  if(sortMode==="za") channels.sort((a,b)=>byName(b,a));
  else if(sortMode==="new") channels.sort((a,b)=>Number(b.id)-Number(a.id));
  else if(sortMode==="old") channels.sort((a,b)=>Number(a.id)-Number(b.id));
  else if(sortMode==="category") channels.sort((a,b)=>String((a.milktv_categories||[])[0]||"").localeCompare(String((b.milktv_categories||[])[0]||""),"ru")||byName(a,b));
  else if(sortMode==="status") channels.sort((a,b)=>String(a.milktv_status||"").localeCompare(String(b.milktv_status||""))||byName(a,b));
  else if(sortMode==="rating") channels.sort((a,b)=>Number(b.milktv_rating||0)-Number(a.milktv_rating||0)||Number(b.milktv_manual_boost||0)-Number(a.milktv_manual_boost||0)||byName(a,b));
  else channels.sort(byName);

  if(!channels.length){

    empty.textContent =
      "📺 Каналы не найдены";

    empty.style.display = "block";

    return;

  }

  empty.style.display = "none";

  channels.forEach(channel => {

    const item =
      document.createElement("a");

    item.className = "channel";

    item.href =
      "/admin/channels/" + encodeURIComponent(channel.id);

    const status = ["online","offline","quarantine","unknown","checking"].includes(channel.milktv_status)
      ? channel.milktv_status
      : "unknown";

    const logo =
      channel.logo
        ? `<img
             class="channel-logo"
             src="${escapeHtml(channel.logo)}"
             alt=""
           >`
        : `<div class="channel-placeholder">
             📺
           </div>`;

    item.innerHTML = `

      ${logo}

      <div class="channel-name">
        ${escapeHtml(channel.name || "Без названия")}
      </div>

      <div class="channel-category">${escapeHtml((channel.milktv_categories || []).join(" · ") || "Без категории")}</div>

      <div class="channel-bottom" title="Проверен ${channel.milktv_last_check ? escapeHtml(new Date(channel.milktv_last_check).toLocaleString()) : "нет данных"}">

        <div class="status admin-marker ${status}" aria-label="Статус канала"></div>

      </div>

      <button type="button" class="admin-rating-shortcut" aria-label="Изменить ручной рейтинг">★ ${Number(channel.milktv_manual_boost||0)}</button>

    `;

    item.querySelector(".admin-rating-shortcut").addEventListener("click",event=>{event.preventDefault();event.stopPropagation();editManualRating(channel)});

    item.addEventListener("click", event => {
      event.preventDefault();
      if(document.body.classList.contains("admin-mode")){
        openSourcesDialog(channel);
      }else{
        showClientPreview(channel);
      }
    });

    list.appendChild(item);

  });

}

async function loadMilktvStats(){

  try{

    const response =
      await fetch("/api/admin/milktv/stats");

    if(!response.ok){
      throw new Error("Ошибка загрузки статистики");
    }

    const stats =
      await response.json();

    document.getElementById("statTotal").textContent =
      Number(stats.total_channels || 0);

    document.getElementById("statOnline").textContent =
      Number(stats.online_channels || 0);

    document.getElementById("statOffline").textContent =
      Number(stats.offline_channels || 0);

    document.getElementById("statQuarantine").textContent =
      Number(stats.quarantine_channels || 0);

    document.getElementById("statUnknown").textContent =
      Number(stats.unknown_channels || 0);

    document.getElementById("statReserve").textContent =
      Number(stats.reserve_channels || 0);

  }catch(error){

    console.error(
      "ОШИБКА СТАТИСТИКИ MILK TV:",
      error
    );

  }

}
async function loadChannels(){

  const empty =
    document.getElementById("empty");

  try{

    const response =
      await fetch("/api/admin/channels");

    if(!response.ok){
      throw new Error(
        "Ошибка загрузки каналов"
      );
    }

    allChannels =
      await response.json();

    updateActionRequired();
    renderChannels();

  }catch(error){

    console.error(error);

    empty.textContent =
      "Не удалось загрузить каналы";

    empty.style.display =
      "block";

  }

}

    });

  });

document.getElementById("sortSelect").addEventListener("change",event=>{sortMode=event.target.value;renderChannels()});

document
  .getElementById("searchInput")
  .addEventListener("input", event => {

    searchText =
      event.target.value
        .trim()
        .toLowerCase();

loadChannels();

async function m3uRequest(url, options = {}){
  const token = await getCsrfToken();
  options.headers = Object.assign({}, options.headers || {}, {"X-CSRF-Token":token});
  const response = await fetch(url, options);
  let data = null;
  try{ data = await response.json(); }catch(error){}
  if(!response.ok) throw new Error((data && data.error) || "Операция не выполнена");
  return data;
}

async function loadM3uProviders(){
  const box = document.getElementById("m3uProviders");
  try{
    const response = await fetch("/admin/milktv/m3u-sources");
    const data = await response.json();
    box.innerHTML = "";
    (data.providers || []).forEach(provider => {
      const row = document.createElement("div"); row.className="m3u-row";
      const diagnostic = provider.last_import_diagnostic || {};
      const diagnosticText = diagnostic.parsed_entries !== undefined ? `Imported: ${diagnostic.parsed_entries} · New: ${diagnostic.new_candidates || 0} · Existing: ${diagnostic.existing_candidates || 0} · Malformed: ${diagnostic.malformed_entries || 0} · Size: ${Math.round((diagnostic.downloaded_bytes || 0)/1024)} KB · Time: ${((diagnostic.duration_ms || 0)/1000).toFixed(1)} s` : "";
      row.innerHTML = `<span class="grow"><b>${escapeHtml(provider.name)}</b> <span class="m3u-muted m3u-url">${escapeHtml(provider.url)}</span><br><span class="m3u-muted">${escapeHtml(provider.import_status || "never")} ${provider.last_import ? escapeHtml(new Date(provider.last_import).toLocaleString()) : ""}</span>${provider.import_error ? ` <span class="m3u-error">${escapeHtml(provider.import_error)}</span>` : ""}<br><span class="m3u-ok">${escapeHtml(diagnosticText)}</span></span>`;
      const button=document.createElement("button");button.className="m3u-button";button.textContent="Импорт";button.type="button";
      button.onclick=async()=>{button.disabled=true;try{await m3uRequest(`/admin/milktv/m3u-sources/${provider.id}/import`,{method:"POST"});await loadM3uProviders();await loadM3uCandidates()}catch(e){alert(e.message)}finally{button.disabled=false}};
      row.appendChild(button);box.appendChild(row);
      const toggle=document.createElement("button");toggle.className="m3u-button";toggle.type="button";toggle.textContent=provider.enabled ? "Отключить" : "Включить";
      toggle.onclick=async()=>{toggle.disabled=true;try{await m3uRequest(`/admin/milktv/m3u-sources/${provider.id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:!provider.enabled})});await loadM3uProviders()}catch(e){alert(e.message)}finally{toggle.disabled=false}};
      row.appendChild(toggle);
    });
  }catch(error){box.textContent="Не удалось загрузить providers";}
}

async function loadM3uAutopilotStatus(){
  try{const r=await fetch("/admin/milktv/m3u-autopilot/status");const s=await r.json();document.getElementById("m3uAutopilotStatus").textContent=s.enabled ? (s.running ? "· scheduler: running" : "· scheduler: enabled") : "· scheduler: disabled";const q=await fetch("/admin/milktv/quality-scheduler/status");const qs=await q.json();document.getElementById("m3uAutopilotStatus").textContent+=qs.enabled ? (qs.running?" · quality: running":" · quality: enabled") : " · quality: disabled";}catch(error){document.getElementById("m3uAutopilotStatus").textContent="· scheduler: unavailable";}
}

async function loadM3uCandidates(){
  const box=document.getElementById("m3uCandidates"), filter=document.getElementById("m3uCandidateFilter").value;
  try{
    const response=await fetch("/admin/milktv/m3u-candidates"); const data=await response.json(); box.innerHTML="";
    let rows=(data.candidates || []).filter(c=>c.state!=="accepted" && c.state!=="rejected" && c.match_confidence==="possible" && (!filter || c.match_confidence===filter)).slice(0,200);
    rows.forEach(candidate=>{
      const row=document.createElement("div");row.className="m3u-row";
      const checkBox=document.createElement("input");checkBox.type="checkbox";checkBox.className="m3u-candidate-check";checkBox.dataset.candidateId=candidate.id;
      const suggested=candidate.suggested_channel_id ? `suggested: ${candidate.suggested_channel_id} (${candidate.match_confidence})` : (candidate.match_confidence || "no-match");
      row.innerHTML=`<span class="grow"><b>${escapeHtml(candidate.name)}</b> <span class="m3u-muted">${escapeHtml(candidate.tvg_name || candidate.tvg_id || "")}</span><br><span class="m3u-muted">${escapeHtml((candidate.providers || []).join(", ")) || "provider unknown"}</span><br><span class="${candidate.health_status === "online" ? "m3u-ok" : "m3u-muted"}">${escapeHtml(candidate.state)} · ${escapeHtml(candidate.health_status)} · ${candidate.response_time || "—"}ms · ${escapeHtml(suggested)}</span></span>`;
      row.insertBefore(checkBox,row.firstChild);
      const check=document.createElement("button");check.className="m3u-button";check.textContent="Проверить";check.type="button";check.onclick=async()=>{check.disabled=true;try{await m3uRequest(`/admin/milktv/m3u-candidates/${candidate.id}/check`,{method:"POST"});await loadM3uCandidates()}catch(e){alert(e.message)}finally{check.disabled=false}};row.appendChild(check);
      if(candidate.state !== "rejected" && candidate.state !== "accepted"){
        const select=document.createElement("select");select.className="m3u-form input";select.dataset.channelSelect=candidate.id;select.innerHTML='<option value="">Канал...</option>';
        allChannels.forEach(ch=>{const o=document.createElement("option");o.value=ch.id;o.textContent=`${ch.name} (${ch.id})`;if(Number(ch.id)===Number(candidate.suggested_channel_id))o.selected=true;select.appendChild(o)});row.appendChild(select);
        const accept=document.createElement("button");accept.className="m3u-button";accept.textContent="Принять";accept.type="button";accept.onclick=async()=>{if(!select.value){alert("Выберите канал");return}try{await m3uRequest(`/admin/milktv/m3u-candidates/${candidate.id}/accept`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({channel_id:Number(select.value)})});await loadM3uCandidates();await loadChannels()}catch(e){alert(e.message)}};row.appendChild(accept);
        const reject=document.createElement("button");reject.className="m3u-button";reject.textContent="Отклонить";reject.type="button";reject.onclick=async()=>{try{await m3uRequest(`/admin/milktv/m3u-candidates/${candidate.id}/reject`,{method:"POST"});await loadM3uCandidates()}catch(e){alert(e.message)}};row.appendChild(reject);
      } else if(candidate.state === "accepted") { row.title = `Принят в channel ${candidate.accepted_channel_id || "—"}`; }
      box.appendChild(row);
    });
    document.getElementById("reviewCount").textContent=rows.length;
    document.getElementById("sideReview").textContent=rows.length;
    if(!rows.length)box.textContent="Candidates не найдены";
  }catch(error){box.textContent="Не удалось загрузить candidates";}
}

document.getElementById("m3uProviderForm")?.addEventListener("submit",async event=>{event.preventDefault();try{await m3uRequest("/admin/milktv/m3u-sources",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("m3uProviderName").value,url:document.getElementById("m3uProviderUrl").value})});event.target.reset();await loadM3uProviders()}catch(error){alert(error.message)}});
document.getElementById("m3uBulkCheck")?.addEventListener("click",async event=>{event.target.disabled=true;try{const result=await m3uRequest("/admin/milktv/m3u-candidates/check",{method:"POST"});event.target.textContent=`Проверено: ${result.checked || 0}`;await loadM3uCandidates()}catch(error){alert(error.message)}finally{event.target.disabled=false}});
document.getElementById("m3uPreview")?.addEventListener("click",async event=>{event.target.disabled=true;try{const result=await m3uRequest("/admin/milktv/m3u-candidates/preview",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({limit:50})});event.target.textContent=`Preview: ${result.checked || 0}`;await loadM3uCandidates()}catch(error){alert(error.message)}finally{event.target.disabled=false}});
document.getElementById("m3uAcceptSelected")?.addEventListener("click",async event=>{const boxes=[...document.querySelectorAll(".m3u-candidate-check:checked")];if(!boxes.length||boxes.length>10){alert("Выберите от 1 до 10 candidates");return}const items=boxes.map(box=>({candidate_id:Number(box.dataset.candidateId),channel_id:Number(document.querySelector(`[data-channel-select="${box.dataset.candidateId}"]`)?.value||0)}));if(items.some(item=>!item.channel_id)){alert("Для каждого candidate выберите channel");return}event.target.disabled=true;try{await m3uRequest("/admin/milktv/m3u-candidates/accept-batch",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items})});await loadM3uCandidates();await loadChannels()}catch(error){alert(error.message)}finally{event.target.disabled=false}});
document.getElementById("m3uCandidateFilter")?.addEventListener("change",loadM3uCandidates);
async function loadDiscovery(){try{const [s,r]=await Promise.all([fetch("/admin/milktv/discovery/sources"),fetch("/admin/milktv/discovery/results?limit=100")]);const sd=await s.json(),rd=await r.json();const sources=sd.sources||[];document.getElementById("discoveryStatus").innerHTML=sources.map(x=>`<div class="m3u-row"><span class="grow"><b>${escapeHtml(x.name)}</b> · ${escapeHtml(x.type||"public_index")} · ${x.enabled?"enabled":"disabled"} · ${escapeHtml(x.status||"never")} ${x.last_run?escapeHtml(new Date(x.last_run).toLocaleString()):""}${x.error?` · <span class="m3u-error">${escapeHtml(x.error)}</span>`:""}</span><button class="m3u-button" type="button" data-discovery-run="${x.id}">Preview</button></div>`).join("")||"Discovery sources не зарегистрированы";document.querySelectorAll("[data-discovery-run]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await m3uRequest(`/admin/milktv/discovery/sources/${b.dataset.discoveryRun}/run`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({dry_run:true})});await loadDiscovery()}catch(e){alert(e.message)}finally{b.disabled=false}});document.getElementById("discoveryResults").innerHTML=(rd.results||[]).slice(0,50).map(x=>`<div class="m3u-row"><span class="grow"><b>${escapeHtml(x.result_type)}</b> ${escapeHtml(x.url)}<br><span class="m3u-muted">${escapeHtml(x.source_name||"")} · ${escapeHtml(x.status)}</span></span></div>`).join("")||"Discovery results не найдены";}catch(e){document.getElementById("discoveryStatus").textContent="Discovery недоступен";}}
document.getElementById("discoveryAdd")?.addEventListener("click",async()=>{try{await m3uRequest("/admin/milktv/discovery/sources",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.getElementById("discoveryName").value,url:document.getElementById("discoveryUrl").value,adapter_type:document.getElementById("discoveryType").value})});await loadDiscovery()}catch(e){alert(e.message)}});
function renderDiscoveryPreview(items){document.getElementById("discoveryResults").innerHTML=(items||[]).flatMap(s=>s.results||[]).slice(0,100).map(x=>`<div class="m3u-row"><span class="grow"><b>${escapeHtml(x.type||x.result_type||"")}</b> ${escapeHtml(x.url||"")}<br><span class="m3u-muted">${escapeHtml(x.status||"")} · ${escapeHtml(x.error||"")}</span></span></div>`).join("")||"Discovery results не найдены";}
document.getElementById("discoveryRun")?.addEventListener("click",async e=>{e.target.disabled=true;try{const x=await m3uRequest("/admin/milktv/discovery/run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({dry_run:true})});e.target.textContent=`Preview: найдено ${(x.sources||[]).reduce((n,s)=>n+(s.found||0),0)}`;renderDiscoveryPreview(x.sources||[]);}catch(err){alert(err.message)}finally{e.target.disabled=false}});
async function openTechnicalPanel(){
  if(!document.body.classList.contains("admin-mode")) return;
  const panel=document.getElementById("technicalPanel");
  panel.dataset.view="tools";
  panel.querySelector("h3").firstChild.textContent="Инструменты ";
  ["m3uProviderForm","m3uProviders","discoveryStatus","discoveryResults","m3uCandidateFilter","m3uBulkCheck","m3uPreview","m3uAcceptSelected","m3uCandidates"].forEach(id=>{const el=document.getElementById(id);if(el)el.hidden=false});
  panel.hidden=false;
  await Promise.all([loadM3uProviders(),loadM3uCandidates(),loadM3uAutopilotStatus(),loadDiscovery()]);
  panel.scrollIntoView({behavior:"smooth",block:"start"});
}
async function openReviewPanel(){
  if(!document.body.classList.contains("admin-mode")) return;
  const panel=document.getElementById("technicalPanel"); panel.dataset.view="review"; panel.querySelector("h3").firstChild.textContent="Требуют решения ";
  ["m3uProviderForm","m3uProviders","discoveryStatus","discoveryResults","m3uCandidateFilter","m3uBulkCheck","m3uPreview","m3uAcceptSelected"].forEach(id=>{const el=document.getElementById(id);if(el)el.hidden=true});
  const list=document.getElementById("m3uCandidates"); list.hidden=false; list.textContent="Загрузка очереди ручного решения…"; panel.hidden=false;
  await loadM3uCandidates(); if(!list.textContent.trim()) list.textContent="Сейчас ручных действий не требуется.";
  panel.scrollIntoView({behavior:"smooth",block:"start"});
}

async function loadAdminAutopilotState(){
  const target=document.getElementById("automationStatus");
  try{
    const response=await fetch("/api/admin/milktv/health-status");
    if(!response.ok) throw Error("status unavailable");
    const state=await response.json(), health=state.health||"—", autopilot=state.autopilot?.state||"—";
    const infra=state.infra_degraded?"DEGRADED":"OK";
    const healthTime=state.last_run?new Date(state.last_run).toLocaleString():"—";
    const autopilotTime=state.autopilot?.last_run?new Date(state.autopilot.last_run).toLocaleString():"—";
    target.innerHTML=`<span class="${infra==="OK"?"ok":"degraded"}">Health: ${escapeHtml(health)}</span><span>Autopilot: ${escapeHtml(autopilot)}</span><span>Last Health: ${escapeHtml(healthTime)}</span><span>Last Autopilot: ${escapeHtml(autopilotTime)}</span><span class="${infra==="OK"?"ok":"degraded"}">Infra: ${infra}</span><button id="actionRequiredFilter" type="button">Нужно вмешательство: ${allChannels.filter(needsIntervention).length}</button>`;
    document.getElementById("actionRequiredFilter").onclick=()=>{actionRequiredOnly=!actionRequiredOnly;statusFilter="";problemsOnly=false;renderChannels();document.querySelector(".channels-box").scrollIntoView({behavior:"smooth",block:"start"});};
  }catch(error){
    target.innerHTML='<span>Health: недоступен</span><span>Autopilot: недоступен</span><button id="actionRequiredFilter" type="button">Нужно вмешательство: '+allChannels.filter(needsIntervention).length+'</button>';
  }
}

function showProblemChannels(){
  selectedCategory="";
  actionRequiredOnly=false;
  problemsOnly=true;
  statusFilter="";
  searchText="";
  document.getElementById("searchInput").value="";
  renderChannels();
  document.querySelector(".channels-box").scrollIntoView({behavior:"smooth",block:"start"});
}

function applyStatFilter(filter){
  actionRequiredOnly=false;
  problemsOnly=false;
  statusFilter=filter;
  document.querySelectorAll(".milktv-stat").forEach(item=>item.classList.remove("active"));
  const activeId={"":"statTotal",online:"statOnline",offline:"statOffline",unknown:"statUnknown",quarantine:"statQuarantine",reserve:"statReserve"}[filter];
  if(activeId) document.getElementById(activeId).closest(".milktv-stat").classList.add("active");
  selectedCategory="";
  document.querySelectorAll(".category").forEach(item=>item.classList.toggle("active",!filter && !item.dataset.category));
  renderChannels();
  document.querySelector(".channels-box").scrollIntoView({behavior:"smooth",block:"start"});
}

function setAdminMode(enabled){
  document.body.classList.toggle("admin-mode",enabled);
  const toggle=document.getElementById("adminModeToggle");
  toggle.setAttribute("aria-pressed",String(enabled));
  toggle.textContent=enabled?"АДМИН: ON":"АДМИН: OFF";
  localStorage.setItem("milktvAdminMode",enabled?"on":"off");
}

document.getElementById("adminModeToggle").addEventListener("click",async()=>{
  const enabled=!document.body.classList.contains("admin-mode");
  setAdminMode(enabled);
  if(enabled) await loadAdminAutopilotState();
});
["statTotal","statOnline","statOffline","statUnknown","statQuarantine","statReserve"].forEach(id=>document.getElementById(id).closest(".milktv-stat").addEventListener("click",()=>applyStatFilter({statTotal:"",statOnline:"online",statOffline:"offline",statUnknown:"unknown",statQuarantine:"quarantine",statReserve:"reserve"}[id])));
setAdminMode(localStorage.getItem("milktvAdminMode")==="on");
loadAdminAutopilotState();
setInterval(loadAdminAutopilotState,20000);

</script>
