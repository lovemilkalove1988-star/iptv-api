<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>МИЛК ТВ</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#090909;
  color:#fff;
  font-family:Arial,sans-serif;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:16px;
}

.header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.back{
  color:#aaa;
  text-decoration:none;
  font-size:28px;
}

.logo{
  font-size:30px;
}

.title{
  font-size:24px;
  font-weight:bold;
}

.subtitle{
  color:#777;
  font-size:12px;
  margin-top:3px;
}

.search{
  margin-bottom:14px;
}

.search input{
  width:100%;
  padding:12px 14px;
  background:#151515;
  color:#fff;
  border:1px solid #292929;
  border-radius:11px;
  outline:none;
  font-size:15px;
}

.categories{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:16px;
}

.category{
  background:#1c1c1c;
  border:1px solid #333;
  border-radius:10px;
  padding:9px 12px;
  color:#ccc;
  cursor:pointer;
  user-select:none;
  font-size:13px;
}

.category:hover{
  background:#252525;
}

.category.active{
  background:#333;
  border-color:#666;
  color:#fff;
}

.channels-box{
  background:#151515;
  border:1px solid #292929;
  border-radius:16px;
  padding:16px;
}

.channels-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:14px;
}

.channel-list{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:10px;
}

.channel{
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:150px;
  padding:12px;
  background:#1c1c1c;
  border:1px solid #292929;
  border-radius:13px;
  color:#fff;
  text-decoration:none;
  cursor:pointer;
  transition:.15s;
}

.channel:hover{
  background:#252525;
  border-color:#4a4a4a;
  transform:translateY(-1px);
}

.channel:active{
  transform:scale(.98);
}

.channel-logo{
  width:68px;
  height:68px;
  object-fit:contain;
  border-radius:10px;
  margin-bottom:9px;
  background:#111;
}

.channel-placeholder{
  width:68px;
  height:68px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  border-radius:10px;
  font-size:32px;
  margin-bottom:9px;
}

.channel-name{
  width:100%;
  text-align:center;
  font-size:13px;
  line-height:16px;
  overflow:hidden;
  text-overflow:ellipsis;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}

.channel-bottom{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:7px;
}

.status{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#222;
  flex-shrink:0;
}

.status.online{
  background:#35d05f;
  box-shadow:0 0 7px rgba(53,208,95,.55);
}

.status.checking{
  background:#e5b93f;
  box-shadow:0 0 7px rgba(229,185,63,.45);
}

.status.offline,
.status.quarantine{
  background:#000;
  border:1px solid #444;
}

.rating{
  font-size:11px;
  color:#888;
}

.channel-boost{
  position:absolute;
  top:8px;
  right:8px;
  min-width:28px;
  padding:4px 6px;
  border-radius:7px;
  color:#ffd166;
  font-size:11px;
  font-weight:bold;
  text-align:center;
  cursor:pointer;
  z-index:2;
}

.channel-boost:hover{
  background:#303030;
}

.empty{
  color:#777;
  text-align:center;
  padding:35px 10px;
}

@media(max-width:800px){
  .channel-list{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}

@media(max-width:560px){
  .container{
    padding:10px;
  }

  .channel-list{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
  }

  .channels-box{
    padding:10px;
  }

  .channel{
    min-height:140px;
    padding:9px;
  }

  .channel-logo,
  .channel-placeholder{
    width:60px;
    height:60px;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="header">

<a class="back" href="/admin">‹</a>

<div class="logo">📺</div>

<div>
<div class="title">МИЛК ТВ</div>
<div class="subtitle">Клиентский вид</div>
</div>

</div>

<div class="search">
<input
  type="text"
  id="searchInput"
  placeholder="🔎 Поиск канала..."
>
</div>

<div class="categories">

<div class="category active" data-category="">
📋 Все
</div>

<div class="category" data-category="Казахстан">
🇰🇿 Казахстан
</div>

<div class="category" data-category="Детские">
🧒 Детские
</div>

<div class="category" data-category="Кино">
🎬 Кино
</div>

<div class="category" data-category="Музыка">
🎵 Музыка
</div>

<div class="category" data-category="Спорт">
⚽ Спорт
</div>

</div>

<div class="channels-box">

<div class="channels-title">
Каналы
</div>

<div class="empty" id="empty">
Загрузка каналов...
</div>

<div class="channel-list" id="channelList"></div>

</div>

</div>

<script>

let allChannels = [];
let selectedCategory = "";
let searchText = "";

function escapeHtml(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function renderChannels(){

  const list =
    document.getElementById("channelList");

  const empty =
    document.getElementById("empty");

  list.innerHTML = "";

  let channels = allChannels;

  if(selectedCategory){

    channels = channels.filter(channel =>
      Array.isArray(channel.milktv_categories) &&
      channel.milktv_categories.includes(selectedCategory)
    );

  }

  if(searchText){

    channels = channels.filter(channel =>
      String(channel.name || "")
        .toLowerCase()
        .includes(searchText)
    );

  }

  if(!channels.length){

    empty.textContent =
      "📺 Каналы не найдены";

    empty.style.display = "block";

    return;

  }

  empty.style.display = "none";

  channels.forEach(channel => {

    const item =
      document.createElement("a");

    item.className = "channel";

    item.href =
      "/channels/" + encodeURIComponent(channel.id);

    const status =
      channel.milktv_status || "offline";

    const boost =
      Number(channel.milktv_manual_boost || 0);

    const boostIcon =
      boost >= 10
        ? "🔥"
        : boost > 0
          ? "⭐"
          : "";

    const logo =
      channel.logo
        ? `<img
             class="channel-logo"
             src="${escapeHtml(channel.logo)}"
             alt=""
           >`
        : `<div class="channel-placeholder">
             📺
           </div>`;

    item.innerHTML = `

      ${logo}

      <div class="channel-name">
        ${escapeHtml(channel.name || "Без названия")}
      </div>

      <div class="channel-bottom">

        <div class="status ${status}"></div>

        <div class="rating">
          Рейтинг: ${Number(channel.milktv_rating || 0).toFixed(1)}
        </div>

      </div>

      <div class="channel-boost">
        ${boostIcon ? boostIcon + " +" + boost : ""}
      </div>

    `;

    const boostElement =
      item.querySelector(".channel-boost");

    boostElement.addEventListener("click", async event => {

      event.preventDefault();
      event.stopPropagation();

      const current =
        Number(channel.milktv_manual_boost || 0);

      const value =
        prompt(
          "Ручной приоритет канала (0–100):",
          current
        );

      if(value === null){
        return;
      }

      const boostValue =
        Number(value);

      if(
        !Number.isInteger(boostValue) ||
        boostValue < 0 ||
        boostValue > 100
      ){

        alert(
          "Введите целое число от 0 до 100"
        );

        return;

      }

      try{

        const response =
          await fetch(
            "/admin/channels/manual-boost",
            {
              method:"POST",
              headers:{
                "Content-Type":
                  "application/x-www-form-urlencoded"
              },
              body:
                "id=" +
                encodeURIComponent(channel.id) +
                "&manual_boost=" +
                encodeURIComponent(boostValue)
            }
          );

        if(!response.ok){
          throw new Error("Ошибка сохранения");
        }

        await loadChannels();

      }catch(error){

        console.error(error);

        alert(
          "Не удалось сохранить приоритет"
        );

      }

    });

    list.appendChild(item);

  });

}

async function loadChannels(){

  const empty =
    document.getElementById("empty");

  try{

    const response =
      await fetch("/api/channels");

    if(!response.ok){
      throw new Error(
        "Ошибка загрузки каналов"
      );
    }

    allChannels =
      await response.json();

    renderChannels();

  }catch(error){

    console.error(error);

    empty.textContent =
      "Не удалось загрузить каналы";

    empty.style.display =
      "block";

  }

}

document
  .querySelectorAll(".category")
  .forEach(button => {

    button.addEventListener("click", () => {

      document
        .querySelectorAll(".category")
        .forEach(item =>
          item.classList.remove("active")
        );

      button.classList.add("active");

      selectedCategory =
        button.dataset.category || "";

      renderChannels();

    });

  });

document
  .getElementById("searchInput")
  .addEventListener("input", event => {

    searchText =
      event.target.value
        .trim()
        .toLowerCase();

    renderChannels();

  });

loadChannels();

</script>

</body>
</html>
